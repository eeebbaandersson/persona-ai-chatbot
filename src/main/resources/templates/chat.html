<!DOCTYPE html>
<html lang="sv" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mind Code Assistant</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../static/css/style.css" th:href="@{/css/style.css}">

    <script src="https://cdn.jsdelivr.net/npm/marked@18.0.3/lib/marked.umd.js" integrity="sha384-[HASH]" crossorigin="anonymous"></script>

</head>
<body>

<div class="app-container">

    <section class="hero-section">
        <h1 class="hero-text">
            Mind-Code<br>Assistant
        </h1>
        <p class="sub-text">
            Your empathetic coding partner. Switch between tactical help and emotional support to keep your flow.
        </p>

        <div class="personality-container">
            <button class="personality-btn" data-id="CODE_HELPER">Code-Helper</button>
            <button class="personality-btn active" data-id="DEFAULT">Assistant</button>
            <button class="personality-btn" data-id="MOOD_BOOSTER">Mood-Booster</button>
        </div>

    </section>

    <main class="chat-window">

        <div id="messages">
            <!-- Messages-->
        </div>

        <div class="input-wrapper">

            <input type="text" id="userInput" aria-label="Chat message"
                   placeholder="What's on your mind today?">
            <button type="button" id="sendButton" class="send-btn" aria-label="Send message"
                    onclick="sendMessage()">↑</button>
        </div>
    </main>
</div>

<script>
   let currentPersonality = 'DEFAULT';
   let sessionId = 'session-' + Math.random().toString(36).substring(2,9);

   function generateSessionId() {
       return 'session-' + Math.random().toString(36).substring(2,9);
   }

   // Handle personality choice
   document.querySelectorAll('.personality-btn').forEach(btn => {
       btn.addEventListener('click', () => {
           document.querySelector('.personality-btn.active').classList.remove('active');
           btn.classList.add('active');
           currentPersonality = btn.getAttribute('data-id');

           // New personality = new session
           sessionId = generateSessionId();
           document.getElementById('messages').innerHTML = '';

           const separator = document.createElement('div');
           separator.className = 'message ai';
           separator.textContent = '- New conversation started -';
           document.getElementById('messages').appendChild(separator);
       });
   });

   async function sendMessage() {
       const input = document.getElementById('userInput');
       const sendBtn = document.getElementById('sendButton');
       const messageText = input.value.trim();

       if (!messageText) return;

       appendMessage(messageText, 'user');
       input.value = '';

       input.disabled = true;
       if (sendBtn) sendBtn.disabled = true;

       showThinkingIndicator();

       try {
           const response = await fetch('/api/v1/chat', {
               method: 'POST',
               headers: {'Content-Type': 'application/json'},
               body: JSON.stringify({
                   personality: currentPersonality,
                   message: messageText,
                   sessionId: sessionId
               })
           });

           removeThinkingIndicator();

          if (!response.ok) {
            const raw = await response.text();
            let message = `Error ${response.status}`;

            try {
                const errorData = raw ? JSON.parse(raw) : null;
                message = errorData?.message || message;
            } catch (_) {
                if (raw) message = raw;
            }
            throw new Error(message);
          }

          const data = await response.json();
          appendMessage(data.response ?? "(empty response)", 'ai');

       } catch (error) {
           removeThinkingIndicator();
           console.error("Error details:", error);
           appendMessage(error.message, 'error');
       } finally {
           input.disabled = false;
           if (sendBtn) sendBtn.disabled = false;
           input.focus();
       }
   }

   function showThinkingIndicator() {
       const messages = document.getElementById('messages');
       const thinkingDiv = document.createElement('div');

       thinkingDiv.id = 'thinkingIndicator';
       thinkingDiv.className = 'message ai thinking';

       thinkingDiv.innerHTML = `
       <span class="thinking-text">Mind-Code is thinking</span>
      <span class="dots"><span>.</span><span>.</span><span>.</span></span>
       `;

       messages.appendChild(thinkingDiv);
       messages.scrollTo({ top: messages.scrollHeight, behavior: 'smooth'});
   }

   function removeThinkingIndicator() {
       const indicator = document.getElementById('thinkingIndicator');
       if (indicator) {
           indicator.remove();
       }
   }

   function appendMessage(text, sender) {
       const messages = document.getElementById('messages');
       const msgDiv = document.createElement('div');

       msgDiv.classList.add('message');

       if (sender === 'user') {
           msgDiv.classList.add('user');
           msgDiv.textContent = text;
       } else if (sender === 'error') {
           msgDiv.classList.add('error');
           msgDiv.textContent = '⚠️ ' + text;
       } else {
           msgDiv.classList.add('ai');
           const cleanText = text.replace(/(\*\*.*?\*\*):?\s*/g, '$1 ');
           if (typeof marked !== 'undefined' && marked.parse) {
               msgDiv.innerHTML = marked.parse(cleanText);
           } else {
               msgDiv.textContent = cleanText;
           }
       }

       messages.appendChild(msgDiv);

       messages.scrollTo({
           top: messages.scrollHeight,
           behavior: 'smooth'
       });
   }

   document.getElementById('userInput').addEventListener('keydown', function (e) {
       if (e.key === 'Enter'){
           if (this.disabled) {
               e.preventDefault();
               return;
           }

           e.preventDefault();
           sendMessage();
       }
   });

</script>
</body>
</html>
